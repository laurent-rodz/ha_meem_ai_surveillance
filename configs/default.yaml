# Default system settings
# Defines the core environment, processing parameters, and model paths

pipeline:
  device: cuda     # Target compute device ('cuda' for GPU or 'cpu' for testing)
  precision: fp16  # Inference precision ('fp16' or 'fp32'). fp16 requires tensorrt.
  batch_size: 15   # Maximum batch size for AdaFace embedding extraction

logging:
  level: INFO      # System log severity level (DEBUG, INFO, WARNING, ERROR)

models:
  scrfd_onnx: models/scrfd_10g_bnkps.onnx  # Path to the SCRFD Face Detection ONNX model
  adaface_onnx: models/adaface.onnx        # Path to the AdaFace Recognition ONNX model